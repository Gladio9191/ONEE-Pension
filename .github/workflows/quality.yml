name: ONEE Pension calculation regression gates
'on':
  push:
    branches: ["qa/toolkit-2026-11-20", "feature/phase2-input-guards"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated synthetic calculation tests
        run: node --test tests/*.test.mjs
